name: Label feature requests by mod

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    if: contains(github.event.issue.labels.*.name, 'enhancement')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const mods = ["TrailWright", "Strength In Numbers", "Stope"];
            const body = context.payload.issue.body || "";
            const match = body.match(/### Mod\s*\n\s*\n?\s*(.+)/);
            if (!match) return;
            const picked = match[1].trim();
            if (!mods.includes(picked)) return;
            const current = context.payload.issue.labels.map(l => l.name);
            for (const m of mods) {
              if (m !== picked && current.includes(m)) {
                await github.rest.issues.removeLabel({ ...context.repo, issue_number: context.issue.number, name: m });
              }
            }
            if (!current.includes(picked)) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: context.issue.number, labels: [picked] });
            }
